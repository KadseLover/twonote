services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # OnlyOffice Document Server – Co-Editing für Word/Excel/PowerPoint/PDF.
  # Erreichbar über Port 8082 (lokal http://localhost:8082, in Prod via eigener
  # Subdomain/Tunnel). JWT_SECRET muss mit ONLYOFFICE_JWT_SECRET im Backend übereinstimmen.
  documentserver:
    image: onlyoffice/documentserver:8.2
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
    ports:
      - "8082:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    restart: unless-stopped

  # Reverse Proxy: TLS-Terminierung + Routing nach Hostname.
  # twonote.<domain> → frontend, office.<domain> → documentserver.
  # Die echte Caddyfile liegt server-lokal (siehe Caddyfile.example).
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - documentserver
    restart: unless-stopped

volumes:
  backend_data:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_cache:
  caddy_data:
  caddy_config:
