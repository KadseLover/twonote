services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
