server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Große Uploads (PDFs, Word-Dokumente)
    client_max_body_size 100M;

    # ES-Module (.mjs) – z. B. der PDF.js-Worker – müssen mit JavaScript-MIME-Type
    # ausgeliefert werden, sonst blockiert der Browser den Modul-Import
    # ("error loading dynamically imported module").
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    # SPA-Routing: unbekannte Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Requests ans Backend proxen (Docker-internes DNS)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI-Docs auch durchreichen (praktisch fürs Debuggen)
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
